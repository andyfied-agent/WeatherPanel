# ESP32 PlatformIO Project for WeatherPanel 3.49

[platformio]
description = Weather Panel for ESP32-S3-Touch-LCD-3.49 (172x640 display with AXS15231B)
author = Adapted from WeatherPanelHKO
license = MIT
platform = espressif32
framework = arduino

[env:esp32s3]
platform = espressif32
board = esp32s3
framework = arduino

; Board-specific configuration for ESP32-S3-Touch-LCD-3.49
; 16MB Flash, 8MB OPI PSRAM, AXS15231B display driver
board_build.fqbn = esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=huge_app,DebugLevel=none,PSRAM=opi,LoopCore=1,EventsCore=1

; Upload settings
upload_speed = 921600

; Serial monitor
monitor_speed = 115200

; Libraries
lib_deps =
    moononournation/Arduino GFX@^2.2.0
    bitbank2/JPEGDEC@^1.8.2

; Build flags
build_flags =
    -D ARDUINO_ARCH_ESP32
    -D ARDUINO_ESP32S3
    -D DISP_WIDTH=172
    -D DISP_HEIGHT=640

; Source files
src_dir = .
